services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoledirecte_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SERVER_PORT=3001
    ports:
      - "3001:3001"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: ecoledirecte_dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
